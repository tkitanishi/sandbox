name: Daily trivia

on:
  schedule:
    - cron: "17 21 * * *"   # 毎日 6:17 JST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update README
        run: python .github/scripts/update_trivia.py
      - name: Commit
        run: |
          if git diff --quiet; then
            echo "No change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update daily trivia [skip ci]"
          git push
